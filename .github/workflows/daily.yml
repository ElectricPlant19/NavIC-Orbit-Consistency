name: NavIC orbit consistency
on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '43 6 * * *'
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC comparison date (YYYY-MM-DD), blank means yesterday'
        required: false
permissions:
  contents: write
concurrency:
  group: navic-acquisition
  cancel-in-progress: false
jobs:
  acquire-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pytest -q
      - run: node --test tests/test_dashboard_loader.cjs tests/test_prospective_dashboard.cjs
      - name: Restore persistent GP archive
        uses: actions/cache/restore@v4
        with:
          path: data
          key: navic-archive-${{ github.run_id }}
          restore-keys: navic-archive-
      - name: Seed initial GP history and shared poll guard
        run: |
          python scripts/prospective_guard.py restore
          python scripts/seed_archive.py
      - name: Poll GP (two-hour guard)
        run: python -m navic_compare.cli poll-gp
      - name: Daily comparison and held-out SGP4 fitting
        id: compare
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 6 * * *'
        env:
          NAVIC_ALERT_WEBHOOK: ${{ secrets.NAVIC_ALERT_WEBHOOK }}
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          # The daily trigger is explicit so delayed starts do not skip processing.
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            if [ -n "$REQUESTED_DATE" ]; then
              python -m navic_compare.cli daily --date "$REQUESTED_DATE"
            else
              python -m navic_compare.cli daily
            fi
          else
            python -m navic_compare.cli daily
          fi
      - name: Current-day acquisition and controlled recency test
        id: fresh
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '11,41 * * * *')
        run: python -m navic_compare.cli fresh
      - name: Issue frozen models and score future navigation messages
        id: track
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '11,41 * * * *')
        env:
          NAVIC_ALERT_WEBHOOK: ${{ secrets.NAVIC_ALERT_WEBHOOK }}
        run: python -m navic_compare.cli track
      - name: Persist shared GP HTTP guard beyond cache retention
        id: guard
        if: always()
        run: python scripts/prospective_guard.py save
      - name: Publish validated dashboard dataset
        if: always() && (steps.compare.outcome == 'success' || steps.fresh.outcome == 'success' || steps.track.outcome == 'success' || steps.guard.outcome == 'success')
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/dist/data dashboard/dist/fresh
          if [ -d history/prospective ]; then git add history/prospective; fi
          if [ -d dashboard/dist/prospective ]; then git add dashboard/dist/prospective; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated NavIC orbit dataset'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Persist raw archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: navic-archive-${{ github.run_id }}
      - name: Archive results, dashboard, and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navic-${{ github.run_id }}
          path: |
            results/
            dashboard/dist/
            data/acquisition.json
            data/acquisition-current.json
            data/acquisitions/
            data/alert.json
            data/prospective-alert.json
            data/pipeline.log
            data/retrievals.jsonl
            data/raw/
            history/prospective/
          retention-days: 90
