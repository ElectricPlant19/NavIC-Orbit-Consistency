[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "navic-orbit-consistency"
version = "0.3.0"
description = "Reproducible broadcast versus GP/SGP4 orbit consistency assessment"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "astropy>=7,<9", "sgp4>=2.24,<3", "requests>=2.32,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
navic-compare = "navic_compare.cli:main"

[tool.setuptools.packages.find]
include = ["navic_compare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
